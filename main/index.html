<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pricing component with toggle built using HTML, CSS and JavaScript.">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | [Challenge Espoir]</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <aside>
        <h1>Our Pricing</h1>
        <div class="check-element">
            <span class="check-info check-left">Annually</span>
            <label class="switch">
                <input type="checkbox" id="menu-toggle" aria-label="Toggle between annual and monthly pricing">
                <span class="slider"></span>
            </label>
            <span class="check-info check-rigth">Monthly</span>
        </div>
    </aside>

    <main>
            <div class="card1">
                <h2 class="sb-title">Basic</h2>
                <p> <span class="devise price monthly-prices">$</span>  <span class="price monthly-prices" id="basic">19.99</span></p>
                <p class="info-el">500 GB Storage</p>
                <p class="info-el">2 Users Allowed</p>
                <p class="info-el">send up to 5 GB</p>
                <button class="l-btn">LEARN MORE</button>
            </div>
            <div class="card2">
                <h2>Professional</h2>
                <p><span class="devise">$</span> <span class="price monthly-price" id="pro">24.99</span></p>
                <p class="info-el">1 TB Storage</p>
                <p class="info-el">5 Users Allowed</p>
                <p class="info-el">send up to 10 GB</p>
                <button class="m-btn">LEARN MORE</button>
            </div>
            <div class="card3">
                <h2 class="sb-title">Master</h2>
                <p><span class="price monthly-prices devise">$</span> <span class="price monthly-prices" id="master"> 39.99</span></p>
                <p class="info-el">2 TB Storage</p>
                <p class="info-el">10 Users Allowed</p>
                <p class="info-el">send up to 20 GB</p>
                <button class="l-btn">LEARN MORE</button>
            </div>

    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="https://www.frontendmentor.io/profile/bigmum0a-wq">Espoir</a>.
    </footer>
    <script src="assets/js/script.js" ></script>
</body>
</html>
